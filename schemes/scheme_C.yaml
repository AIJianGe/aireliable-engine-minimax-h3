# ============================================================
# 方案 C：8G 显存 + 16G 内存极低配版
# ------------------------------------------------------------
# 目标硬件：RTX 3060 Ti 8GB / 4060 8GB + 16GB 系统内存
# 模型来源：OzzyGT/MiniMax_H3_sdnq_dynamic_4bit（SDNQ 4bit 量化，~75GB）
# 性能预期：5 秒 480p 视频 ~10-15 分钟，质量损失明显但可用
#
# 加速组合（最激进）：
#   - SageAttention（INT8 QK + FP8 PV）：1.5-2x 加速
#   - LightX2V Turbo LoRA（8-step 蒸馏）：6x 加速（仅 FL2VA）
#   - TE-Speed 块级缓存（sigma 差先验，v0.7.7+，替代 FirstBlockCache）：缓存放 CPU 省显存
#   - BlockSwap（自定义 diffusers 版）：把 50% transformer 块卸载到 CPU
#   - VAE tiling：VAE 解码分块进行，降低显存峰值
#
# 注意：BlockSwap 与 L3 激进 offload 二选一，避免重复搬移
# ============================================================
scheme: C
name: 8G 显存 + 16G 内存极低配版
description: "[L3策略] RTX 3060 Ti 8G + 16G内存，5秒480p约10-15min。全部CPU，推理时transformer临时上GPU，VRAM稳态3GB/峰值20GB，RAM 48GB(可吃虚拟缓存)，适合16GB显存+大内存"
vram_required: 8GB

# 模型来源（SDNQ 4bit 量化版）
model_repo: OzzyGT/MiniMax_H3_sdnq_dynamic_4bit
model_subdir: sdnq_format
precision: sdnq_uint4
size_gb: 75

# 加载策略
# v0.6.12+ 修订：BlockSwap（块级别 offload）尚未实现，scheme_C 退化为 L1
# 会导致 transformer(17.5GB) 全在 GPU，8GB 显存场景直接 OOM。
# 改用 L3（重度卸载）：transformer 平时在 CPU/RAM，推理时临时上 GPU，
# 显存峰值仅 ~17.5GB + attention，适合 8-24GB 显存 + 大内存场景。
# 待 BlockSwap 实现后可切回 L1 + BlockSwap 组合。
offload_level: L3
device: cuda:0

# 加速方案（最激进组合）
acceleration:
  sage_attention:
    enabled: true
    backend: int8_fp8
  lora:
    enabled: true
    name: lightx2v_turbo_8step
    path: loras/lightx2v_turbo_8step.safetensors
    scale: 1.0
    supports_paradigms: [FL2VA]
  first_block_cache:
    enabled: false                 # v0.7.7+ 由 TE-Speed 块级缓存替代（patcher 互斥，FBC 不再注入）
    threshold: 0.08   # 阈值更宽松，增加复用率
  te_speed_cache:
    enabled: true                  # v0.7.7+ T3.2：8 步 sigma 差 0.125 > 0.12 天然不触发，无副作用
    control_value: 0.12
    percent_1: 0.1
    percent_2: 0.9
    start_block_ratio: 0.5
    device: cpu                    # 8GB 极低配：段输出缓存存 CPU，命中时搬回 GPU 一次，避免占显存

# 显存优化（核心）
# v0.6.12+ 修订：BlockSwap 与 L3 同时使用会导致设备冲突
# （某些 block 权重未正确移到 GPU，报 mat1 is on cpu 错误）
# L3 模式下 transformer 整体在推理时移到 GPU，不需要 BlockSwap
# 待 BlockSwap 设备冲突修复后可重新启用
block_swap:
  enabled: false
  swap_blocks: 20      # 把 20/40 个 transformer 块卸载到 CPU（50%）
  swap_strategy: even  # 均匀分布，避免连续块都在 CPU
vae_tiling:
  enabled: true
  tile_size: 256       # VAE 解码分块大小

# 推理参数
inference:
  num_inference_steps: 8
  scheduler: simple
  sampler: euler
  guidance_scale: 7.0
  flow_shift: 12.0            # 与模型 checkpoint 默认一致（视频 shift=12）
  audio_flow_shift: 3.0       # 与模型 checkpoint 默认一致（音频 shift=3）
  default_resolution: 608x352   # 官方 0.2MP 最低，适配 8G 显存
  default_fps: 24
  default_duration: 5

# 适用 variant
applicable_variants:
  - MiniMax/H3-FL2VA-SDNQ
  - MiniMax/H3-Ref2VA-SDNQ
